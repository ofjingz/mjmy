<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0F">
  <meta name="description" content="幕间漫游 · 影院星球。沿着投稿者留下的图文，走进一间影院。">
  <title>影院星球 · 幕间漫游</title>
  <link rel="icon" href="assets/planet-icon.svg?v=film-v3" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=submissions-20261120">
  <link rel="stylesheet" href="/shared/shell.css?v=exhibit-return-20261120">
  <script src="/shared/routes.js?v=roam-arrival-v4" defer></script>
  <script src="/shared/footprint.js?v=roam-arrival-v4" defer></script>
  <script src="/shared/shell.js?v=roam-arrival-v4" defer></script>
  <script src="data.js" defer></script>
  <script src="record.js" defer></script>
  <script src="planet.js?v=film-101-v9" defer></script>
  <script src="app.js?v=submissions-20261120" defer></script>
</head>
<body data-module="cinema">
  <div class="grain" aria-hidden="true"></div>
  <p id="cinema-status" class="sr-only" role="status"></p>
  <main class="universe" id="universe">
    <h1 class="sr-only">影院星球</h1>
    <header class="masthead">
      <a class="mj-return mj-return--header" href="/hub/#hall" data-exhibit-return><span aria-hidden="true">←</span><span class="mj-orbit-mark" aria-hidden="true"></span><span>返回展厅</span></a>
      <nav aria-label="影院星球导航">
        <button class="quiet" id="open-directory">影院目录 </button>
        <button class="quiet record-link" id="open-ticket">我的票根 </button>
      </nav>
    </header>

    <section class="planet-stage" id="planet-stage" tabindex="0" aria-label="可拖动的影院星球，左右方向键切换影院">
      <canvas id="planet" aria-hidden="true"></canvas>
      <div class="planet-markers" id="planet-markers" aria-label="球面上的影院"></div>
    </section>

    <aside class="cinema-preview" id="cinema-preview" aria-label="当前影院">
      <div class="preview-meta"><span id="preview-city"></span></div>
      <button class="preview-image-button" id="preview-open" aria-label="打开当前影院图文">
        <span class="photo-corners" aria-hidden="true"></span>
        <img id="preview-image" alt="" decoding="async">
      </button>
      <h2 id="preview-name"></h2><p class="original-name" id="preview-original"></p>
      <p class="contributor" id="preview-contributor"></p>
      <div class="preview-actions">
        <div class="mark-buttons" aria-label="标记当前影院">
          <button class="mark" id="preview-visited" aria-pressed="false"><span aria-hidden="true">✓</span> 去过</button>
          <button class="mark" id="preview-wishlist" aria-pressed="false"><span aria-hidden="true">＋</span> 想去</button>
        </div>
        <button class="read-link" id="read-cinema">查看图文 <span aria-hidden="true">↗</span></button>
      </div>
    </aside>

    <footer class="controls">
      <p class="interaction-hint"><span class="desktop-hint">拖动星球 · 点击影院</span><span class="mobile-hint">滑动星球 · 轻点影院</span></p>
      <div class="transport" aria-label="影院导览">
        <button class="transport-step" id="previous" aria-label="上一家影院">←</button>
        <button class="tour-button" id="tour" aria-pressed="false"><span id="tour-symbol" aria-hidden="true">▷</span><span id="tour-label">自动漫游</span></button>
        <button class="transport-step" id="next" aria-label="下一家影院">→</button>
      </div>
      <span class="tour-progress" id="tour-progress" aria-hidden="true"></span>
    </footer>
  </main>

  <dialog class="directory-dialog" id="directory-dialog" aria-labelledby="directory-title">
    <header class="dialog-header"><div><p class="overline">影院星球</p><h2 id="directory-title">影院目录</h2></div><button class="close-button" data-close="directory-dialog" aria-label="关闭影院目录">×</button></header>
    <label class="search-field"><span class="sr-only">搜索影院、城市或投稿人</span><input id="cinema-search" type="search" placeholder="影院、城市、投稿人" autocomplete="off"><span aria-hidden="true">⌕</span></label>
    <div class="directory-list" id="directory-list"></div>
    <p class="empty-state" id="search-empty" hidden>没有找到对应影院</p>
  </dialog>

  <dialog class="detail-dialog" id="detail-dialog" aria-labelledby="detail-name">
    <header class="detail-header"><span id="detail-city"></span><div><button class="quiet" id="detail-tour" aria-pressed="false">▷ 继续漫游</button><button class="quiet" id="copy-link">复制链接</button><button class="close-button" data-close="detail-dialog" aria-label="关闭影院图文">×</button></div></header>
    <div class="detail-layout">
      <section class="gallery" aria-label="影院照片">
        <button class="gallery-image-button" id="gallery-open" aria-label="放大查看影院照片"><img id="gallery-image" alt="" decoding="async"><span class="enlarge-hint" aria-hidden="true">↗</span></button>
        <div class="gallery-toolbar"><p id="gallery-credit"></p><div><button class="gallery-step" id="gallery-prev" aria-label="上一张影院照片">←</button><button class="gallery-step" id="gallery-next" aria-label="下一张影院照片">→</button></div></div>
        <div class="gallery-thumbs" id="gallery-thumbs" aria-label="选择照片"></div>
      </section>
      <article class="detail-copy"><p class="overline" id="detail-type"></p><h2 id="detail-name"></h2><p class="original-name" id="detail-original"></p><p class="contributor" id="detail-contributor"></p><div class="mark-buttons detail-marks"><button class="mark" id="detail-visited" aria-pressed="false"><span aria-hidden="true">✓</span> 去过</button><button class="mark" id="detail-wishlist" aria-pressed="false"><span aria-hidden="true">＋</span> 想去</button></div><div id="detail-stories"></div></article>
    </div>
    <footer class="detail-footer"><button class="quiet" id="detail-prev">← 上一家</button><button class="quiet" id="detail-next">下一家 →</button></footer>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="影院照片大图">
    <header><span id="lightbox-label"></span><div><button class="quiet" id="lightbox-tour" aria-pressed="false">▷ 继续漫游</button><button class="quiet" id="zoom-image" aria-pressed="false">放大</button><button class="close-button" data-close="lightbox" aria-label="关闭照片大图">×</button></div></header>
    <div class="lightbox-scroll" id="lightbox-scroll"><img id="lightbox-image" alt=""></div>
    <footer><button class="gallery-step" id="lightbox-prev" aria-label="上一张大图">←</button><p id="lightbox-credit"></p><button class="gallery-step" id="lightbox-next" aria-label="下一张大图">→</button></footer>
  </dialog>

  <dialog class="ticket-dialog" id="ticket-dialog" aria-labelledby="ticket-title">
    <header class="dialog-header"><div><p class="overline">幕间漫游</p><h2 id="ticket-title">我的影院票根</h2></div><button class="close-button" data-close="ticket-dialog" aria-label="关闭观展票根">×</button></header>
    <div class="ticket" id="ticket-content"><div class="ticket-top"><span>影院星球</span><span id="ticket-date"></span></div><div class="ticket-counts"><div><strong id="visited-count">0</strong><span>去过</span></div><span class="ticket-cross" aria-hidden="true">↗</span><div><strong id="wishlist-count">0</strong><span>想去</span></div></div><div class="ticket-lists"><section><h3>去过的影院</h3><ol id="visited-list"></ol></section><section><h3>想去的影院</h3><ol id="wishlist-list"></ol></section></div><div class="ticket-bottom"><span id="ticket-number"></span><span>本次观展记录</span></div></div>
    <p class="record-note" id="record-note">选择保存在当前浏览器。去过与想去可同时标记。</p>
    <div class="ticket-actions"><button class="primary-button" id="save-ticket">保存票根图片 ↓</button><button class="quiet" id="export-record">导出影院记录</button></div>
    <details class="reset-section"><summary>开始新的观展</summary><p>重新开始后，当前选择将清空。已保存的票根不受影响。</p><button class="quiet" id="reset-visit">清空选择，重新开始 →</button></details>
  </dialog>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <noscript><p class="no-script">请启用 JavaScript 进入影院星球。</p></noscript>
  <script>
    (function () {
      function syncExistingCinemaChoices() {
        try {
          if (!window.MujianFootprint) return;
          var raw = localStorage.getItem('mujian.cinema-visit.v1');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (!parsed || !parsed.choices || typeof parsed.choices !== 'object') return;
          var visited = [];
          var wishlist = [];
          Object.keys(parsed.choices).forEach(function (id) {
            var c = parsed.choices[id];
            if (c && c.visited) visited.push(id);
            if (c && c.wishlist) wishlist.push(id);
          });
          if (visited.length || wishlist.length) {
            window.MujianFootprint.syncCinema(visited, wishlist);
          }
        } catch (_) {}
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncExistingCinemaChoices);
      } else {
        syncExistingCinemaChoices();
      }
    })();
  </script>
</body>
</html>
